name: ci

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:

jobs:
  extensions:
    name: Editor extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: VS Code extension
        working-directory: vscode-gdtest
        run: |
          npm ci
          npm test
      - name: Zed extension
        working-directory: zed-gdtest
        run: cargo build --release --locked --target wasm32-wasip1

  test:
    name: ${{ matrix.os }} / Godot ${{ matrix.godot }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        godot: ['4.7']
        include:
          - os: ubuntu-latest
            godot: '4.6.2'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-v2-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - name: Install Godot
        shell: bash
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${{ matrix.godot }}-stable"
          name="Godot_v${{ matrix.godot }}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL -o godot.zip "$base/${name}_linux.x86_64.zip"
              unzip -q godot.zip -d "$RUNNER_TEMP/godot"
              exe="$RUNNER_TEMP/godot/${name}_linux.x86_64" ;;
            Windows)
              curl -fsSL -o godot.zip "$base/${name}_win64.exe.zip"
              unzip -q godot.zip -d "$RUNNER_TEMP/godot"
              exe="$RUNNER_TEMP/godot/${name}_win64_console.exe" ;;
            macOS)
              curl -fsSL -o godot.zip "$base/${name}_macos.universal.zip"
              unzip -q godot.zip -d "$RUNNER_TEMP/godot"
              exe="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" ;;
          esac
          chmod +x "$exe" || true
          echo "GODOT_EXE=$exe" >> "$GITHUB_ENV"
      - name: Hide build output from Godot
        # target/package holds copies of the addons, whose class names would clash.
        shell: bash
        run: touch target/.gdignore
      - name: Import project
        shell: bash
        run: |
          # Godot can crash on exit after a successful import; the next step
          # is what decides whether the class cache is usable.
          "$GODOT_EXE" --headless --path . --import || true
      - name: GDScript self-tests
        shell: bash
        run: ./target/debug/gdtest --reporter tap
      - name: Packaged crates build
        shell: bash
        run: cargo package --workspace --locked --target-dir "$RUNNER_TEMP/package"
