name: docs
# Only on main and PRs, and only when the docs or the files they quote change:
# a plain `push` trigger also ran on every tag and twice on each PR push.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'test/docs/**'
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - 'docs/**'
      - 'test/docs/**'
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: cd docs && npm ci && npm run build
