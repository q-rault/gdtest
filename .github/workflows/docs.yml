name: docs
# Only on main and PRs, and only when the docs or the files they quote change:
# a plain `push` trigger also ran on every tag and twice on each PR push.
# PRs only build; pushes to main also publish to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'test/docs/**'
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - 'docs/**'
      - 'test/docs/**'
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: cd docs && npm ci && npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
