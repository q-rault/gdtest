[workspace]
resolver = "2"
members = [
    "crates/gdtest",
    "crates/gdtest-analysis",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdtest"
homepage = "https://github.com/q-rault/gdtest"
authors = ["Quentin Rault"]

[workspace.dependencies]
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive", "env"] }
owo-colors = "4"
walkdir = "2"
gdsyntax = "0.1.2"
regex = "1.11"
notify = "8"
anyhow = "1"
thiserror = "2"
toml = "0.8"

gdtest-analysis = { path = "crates/gdtest-analysis", version = "0.2.0" }

[profile.release]
lto = "thin"
codegen-units = 1
